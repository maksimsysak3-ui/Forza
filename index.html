<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low Poly Drive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block}

/* ── MENU ── */
#menu{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);
  transition:opacity 0.8s;
}
#menu-content{position:relative;z-index:1;text-align:center}
#menu h1{
  font-size:72px;font-weight:900;letter-spacing:-1px;color:#fff;
  text-shadow:0 4px 40px rgba(0,0,0,0.5),0 0 80px rgba(255,136,68,0.2);margin-bottom:4px;
}
#menu h1 span{
  background:linear-gradient(135deg,#ff8844,#ffcc44);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
#menu .sub{
  color:rgba(255,255,255,0.5);font-size:14px;letter-spacing:6px;
  text-transform:uppercase;margin-bottom:50px;
}
#play-btn{
  background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.18);color:#fff;
  padding:18px 60px;font-size:17px;font-weight:600;letter-spacing:2px;
  border-radius:60px;cursor:pointer;transition:all 0.3s;
  text-transform:uppercase;
}
#play-btn:hover{
  background:rgba(255,255,255,0.2);
  box-shadow:0 8px 40px rgba(255,136,68,0.25);
  transform:translateY(-2px);
}
#menu .hint{
  color:rgba(255,255,255,0.25);font-size:11px;margin-top:30px;
  letter-spacing:1px;
}

/* ── HUD ── */
#hud{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  display:flex;gap:14px;align-items:flex-end;pointer-events:none;z-index:10;
  opacity:0;transition:opacity 0.6s;
}
#hud.show{opacity:1}
.hp{
  background:rgba(0,0,0,0.45);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  padding:10px 18px;color:#fff;
}
#speedo{text-align:center;min-width:120px}
#speed-val{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#speed-unit{font-size:11px;opacity:0.4;letter-spacing:1px}
#gear-box{text-align:center;min-width:50px}
#gear-lbl{font-size:9px;opacity:0.35;letter-spacing:1px;text-transform:uppercase}
#gear-val{font-size:32px;font-weight:800}
#rpm-box{width:160px}
#rpm-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
#rpm-fill{height:100%;width:0%;border-radius:3px;transition:background 0.15s}
#rpm-txt{font-size:10px;opacity:0.35;margin-top:5px;font-variant-numeric:tabular-nums}

/* ── MINIMAP ── */
#minimap{
  position:fixed;bottom:28px;right:24px;width:160px;height:160px;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);border-radius:14px;
  z-index:10;opacity:0;transition:opacity 0.6s;
}
#minimap.show{opacity:1}
#minimap canvas{border-radius:14px}

/* ── CONTROLS ── */
#controls{
  position:fixed;top:20px;right:20px;z-index:10;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.06);border-radius:12px;
  padding:12px 16px;color:rgba(255,255,255,0.5);font-size:11px;
  line-height:1.9;pointer-events:none;opacity:0;transition:opacity 0.6s;
}
#controls.show{opacity:1}
#controls kbd{
  background:rgba(255,255,255,0.1);border-radius:3px;
  padding:1px 5px;font-family:inherit;font-size:10px;color:rgba(255,255,255,0.7);
}
</style>

<body>

<div id="menu">
  <div id="menu-content">
    <h1><span>LOW POLY</span> DRIVE</h1>
    <div class="sub">Free Roam</div>
    <button id="play-btn">Start Driving</button>
    <div class="hint">Cozy open world cruising</div>
  </div>
</div>

<div id="hud">
  <div class="hp" id="rpm-box">

  <div class="hp" id="speedo">
    <div id="speed-val">0</div>
    <div id="speed-unit">KM/H</div>
  </div>
  <div class="hp" id="gear-box">
    <div id="gear-lbl">Gear</div>
    <div id="gear-val">N</div>
  </div>
</div>

<div id="minimap"><canvas id="mm" width="160" height="160"></canvas></div>

<div id="controls">
  <kbd>W</kbd> Throttle &nbsp; <kbd>S</kbd> Brake<br>
  <kbd>A</kbd> Left &nbsp; <kbd>D</kbd> Right<br>
  <kbd>Space</kbd> Handbrake<br>
  <kbd>C</kbd> Camera &nbsp; <kbd>R</kbd> Reset
</div>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════ */
const ROAD_Y = 0.25;
const ROAD_W = 10;
const SIDEWALK_H = 0.35;
const BARRIER_GAP = 18;

const CAR = {
  mass:1200, torque:310,
  gears:[0,3.6,2.2,1.5,1.1,0.85,0.68],
  final:3.5, wheelR:0.30,
  maxRPM:7500, idle:800, upShift:7000, downShift:2500,
  drag:0.42, roll:12, brakeF:4200, hbrakeF:2800,
  maxSteer:0.55, steerSpd:3.0, steerRet:4.5,
  wb:2.5, tw:1.6, cgH:0.45,
  gripF:1.4, gripR:1.35, csF:14, csR:13,
  downforce:0.45
};

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let scene, cam, renderer, clock;
let car;
let keys = {};
let camMode = 0;
let playing = false;

const P = {
  pos: new THREE.Vector3(0, ROAD_Y + 0.30, 20),
  vel: new THREE.Vector3(0,0,0),
  head: 0, angVel: 0,
  rpm: 800, gear: 1, speed: 0,
  wAngle: 0, pitch: 0, roll: 0,
  pVel: 0, rVel: 0, drift: 0, slip: 0
};

let collidables = [];
let roadSegs = [];

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
let menuCamAngle = 0;

function init(){

  scene = new THREE.Scene();

  // sky
  const skyC = document.createElement('canvas');
  skyC.width=2; skyC.height=512;
  const sCtx = skyC.getContext('2d');
  const sG = sCtx.createLinearGradient(0,0,0,512);
  sG.addColorStop(0,'#6cacde');
  sG.addColorStop(0.3,'#a8d4f0');
  sG.addColorStop(0.55,'#f5e0c0');
  sG.addColorStop(0.75,'#e8a870');
  sG.addColorStop(1,'#d08050');
  sCtx.fillStyle=sG; sCtx.fillRect(0,0,2,512);
  scene.background = new THREE.CanvasTexture(skyC);
  scene.fog = new THREE.FogExp2(0xd4c8b8, 0.0012);

  cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.5, 2000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // lights
  scene.add(new THREE.AmbientLight(0xfff5e0, 0.55));
  scene.add(new THREE.HemisphereLight(0x88bbdd, 0x445522, 0.45));
  const sun = new THREE.DirectionalLight(0xffeecc, 1.5);
  sun.position.set(250,350,200);
  sun.castShadow=true;
  sun.shadow.mapSize.set(4096,4096);
  sun.shadow.camera.near=10; sun.shadow.camera.far=900;
  sun.shadow.camera.left=-500; sun.shadow.camera.right=500;
  sun.shadow.camera.top=500; sun.shadow.camera.bottom=-500;
  sun.shadow.bias=-0.0008;
  scene.add(sun);

  buildWorld();
  buildCar();

  window.addEventListener('keydown', e=>{
    keys[e.code]=true;
    if(e.code==='KeyC') camMode=(camMode+1)%3;
    if(e.code==='KeyR') resetCar();
  });
  window.addEventListener('keyup', e=>{ keys[e.code]=false });
  window.addEventListener('resize',()=>{
    cam.aspect=innerWidth/innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  document.getElementById('play-btn').onclick = ()=>{
    document.getElementById('menu').style.opacity='0';
    document.getElementById('menu').style.transition='opacity 0.8s';
    setTimeout(()=>{
      document.getElementById('menu').style.display='none';
      document.getElementById('hud').classList.add('show');
      document.getElementById('minimap').classList.add('show');
      document.getElementById('controls').classList.add('show');
      playing=true;
    },800);
  };

  animate();
}

/* ═══════════════════════════════════════════
   ROAD SYSTEM
   ═══════════════════════════════════════════ */
const roadMat = new THREE.MeshLambertMaterial({color:0x3a3a44, flatShading:true});
const sidewalkMat = new THREE.MeshLambertMaterial({color:0x777777, flatShading:true});
const lineMat = new THREE.MeshLambertMaterial({color:0xdddd55});
const dashMat = new THREE.MeshLambertMaterial({color:0xeeeeee});
const greenMat = new THREE.MeshLambertMaterial({color:0x55aa33, flatShading:true});

// store intersection zones so we skip barriers there
let intersections = [];

function addIntersection(x, z, size){
  intersections.push({x,z,size: size||ROAD_W+4});

  // intersection road surface (flat plane, not a box)
  const s2 = size||ROAD_W+4;
  const g = new THREE.PlaneGeometry(s2, s2);
  const m = new THREE.Mesh(g, roadMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(x, ROAD_Y, z);
  m.receiveShadow=true;
  scene.add(m);
}

function isInIntersection(x, z){
  for(const it of intersections){
    if(Math.abs(x-it.x)<it.size/2+2 && Math.abs(z-it.z)<it.size/2+2) return true;
  }
  return false;
}

function buildStraightRoad(x1,z1,x2,z2,width){
  width = width || ROAD_W;
  const dx=x2-x1, dz=z2-z1;
  const len=Math.sqrt(dx*dx+dz*dz);
  const ang=Math.atan2(dx,dz);
  const nx=-dz/len, nz=dx/len;

  // raised road surface
  const rGeo = new THREE.BoxGeometry(width, ROAD_Y, len);
  const road = new THREE.Mesh(rGeo, roadMat);
  road.position.set((x1+x2)/2, ROAD_Y/2, (z1+z2)/2);
  road.rotation.y = ang;
  road.receiveShadow=true;
  scene.add(road);

  // center dashed yellow line
  const dashLen = 3, gapLen = 2;
  const totalUnit = dashLen + gapLen;
  const numDashes = Math.floor(len / totalUnit);
  for(let i=0;i<numDashes;i++){
    const t = (i * totalUnit + dashLen/2) / len;
    const cx = x1+dx*t, cz = z1+dz*t;
    if(isInIntersection(cx,cz)) continue;
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, dashLen), lineMat);
    d.position.set(cx, ROAD_Y+0.01, cz);
    d.rotation.y = ang;
    scene.add(d);
  }

  // edge white dashes
  for(let side=-1;side<=1;side+=2){
    const ox = nx*(width/2-0.3)*side;
    const oz = nz*(width/2-0.3)*side;
    for(let i=0;i<numDashes;i++){
      const t = (i * totalUnit + dashLen/2) / len;
      const cx = x1+dx*t+ox, cz = z1+dz*t+oz;
      if(isInIntersection(cx,cz)) continue;
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, dashLen*0.5), dashMat);
      d.position.set(cx, ROAD_Y+0.01, cz);
      d.rotation.y = ang;
      scene.add(d);
    }
  }

  // sidewalks / curbs on edges
  for(let side=-1;side<=1;side+=2){
    const sw = 1.2;
    const offset = (width/2 + sw/2);
    const sGeo = new THREE.BoxGeometry(sw, SIDEWALK_H, len);
    const sidewalk = new THREE.Mesh(sGeo, sidewalkMat);
    sidewalk.position.set(
      (x1+x2)/2 + nx*offset*side,
      SIDEWALK_H/2,
      (z1+z2)/2 + nz*offset*side
    );
    sidewalk.rotation.y = ang;
    sidewalk.receiveShadow=true; sidewalk.castShadow=true;
    scene.add(sidewalk);
  }

  // barriers along road (skip intersections)
  for(let side=-1;side<=1;side+=2){
    const bOffset = width/2 + 1.8;
    const segLen = 8;
    const segs = Math.floor(len / segLen);
    for(let i=0;i<segs;i++){
      const t = (i+0.5)/segs;
      const bx = x1+dx*t + nx*bOffset*side;
      const bz = z1+dz*t + nz*bOffset*side;
      if(isInIntersection(bx, bz)) continue;

      // small roadside post
      const post = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.6, 0.1),
        new THREE.MeshLambertMaterial({color:0xcccccc, flatShading:true})
      );
      post.position.set(bx, 0.3 + ROAD_Y, bz);
      post.castShadow=true;
      scene.add(post);

      // reflector
      const ref = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.08, 0.05),
        new THREE.MeshLambertMaterial({color: side>0?0xff4444:0xff4444, emissive:0x441111, flatShading:true})
      );
      ref.position.set(bx, 0.55 + ROAD_Y, bz);
      ref.rotation.y = ang;
      scene.add(ref);
    }
  }

  // store for minimap
  roadSegs.push({x1,z1,x2,z2,w:width});

  // store barrier collision lines (skip intersection zones)
  for(let side=-1;side<=1;side+=2){
    const bOff = width/2 + 2.0;
    const bx1 = x1 + nx*bOff*side, bz1 = z1 + nz*bOff*side;
    const bx2 = x2 + nx*bOff*side, bz2 = z2 + nz*bOff*side;
    // split into sub-segments, skip intersection ones
    const subSegs = 10;
    for(let i=0;i<subSegs;i++){
      const t0=i/subSegs, t1=(i+1)/subSegs;
      const sx1=bx1+(bx2-bx1)*t0, sz1=bz1+(bz2-bz1)*t0;
      const sx2=bx1+(bx2-bx1)*t1, sz2=bz1+(bz2-bz1)*t1;
      const mx=(sx1+sx2)/2, mz=(sz1+sz2)/2;
      if(isInIntersection(mx,mz)) continue;
      const sLen=Math.sqrt((sx2-sx1)**2+(sz2-sz1)**2);
      collidables.push({
        type:'line', x1:sx1,z1:sz1,x2:sx2,z2:sz2,
        nx:nx*side, nz:nz*side, len:sLen
      });
    }
  }
}

function buildCurvedRoad(points, width){
  width = width || ROAD_W;
  for(let i=0;i<points.length-1;i++){
    buildStraightRoad(points[i].x, points[i].z, points[i+1].x, points[i+1].z, width);
  }
}

/* ═══════════════════════════════════════════
   ENVIRONMENT OBJECTS
   ═══════════════════════════════════════════ */
function mkTree(x,z,type){
  const g = new THREE.Group();
  const cols = [
    [0x7a4420, 0xcc3322, 0xee5533], // red autumn
    [0x6b3a1a, 0xee7733, 0xffaa44], // orange autumn
    [0x5c3317, 0xddaa00, 0xffcc22], // yellow autumn
    [0x6b4226, 0x228833, 0x33aa44], // green
  ];
  const c = cols[(type||0) % cols.length];
  const scale = 0.8 + Math.random()*0.7;

  // trunk
  const tH = 2 + Math.random()*1.5;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12*scale, 0.22*scale, tH*scale, 5),
    new THREE.MeshLambertMaterial({color:c[0], flatShading:true})
  );
  trunk.position.y = tH*scale/2;
  trunk.castShadow=true;
  g.add(trunk);

  // round foliage (like the reference image - big round canopy)
  const fGeo = new THREE.IcosahedronGeometry(2.2*scale, 1);
  const fp = fGeo.attributes.position;
  for(let i=0;i<fp.count;i++){
    fp.setX(i, fp.getX(i)+(Math.random()-0.5)*0.35*scale);
    fp.setY(i, fp.getY(i)+(Math.random()-0.5)*0.35*scale);
    fp.setZ(i, fp.getZ(i)+(Math.random()-0.5)*0.35*scale);
  }
  fGeo.computeVertexNormals();
  const foliage = new THREE.Mesh(fGeo,
    new THREE.MeshLambertMaterial({color:c[1], flatShading:true})
  );
  foliage.position.y = tH*scale + 1.2*scale;
  foliage.castShadow=true;
  g.add(foliage);

  // second smaller canopy
  if(Math.random()>0.4){
    const f2Geo = new THREE.IcosahedronGeometry(1.5*scale, 1);
    const f2p = f2Geo.attributes.position;
    for(let i=0;i<f2p.count;i++){
      f2p.setX(i, f2p.getX(i)+(Math.random()-0.5)*0.25*scale);
      f2p.setY(i, f2p.getY(i)+(Math.random()-0.5)*0.25*scale);
      f2p.setZ(i, f2p.getZ(i)+(Math.random()-0.5)*0.25*scale);
    }
    f2Geo.computeVertexNormals();
    const f2 = new THREE.Mesh(f2Geo,
      new THREE.MeshLambertMaterial({color:c[2], flatShading:true})
    );
    f2.position.set((Math.random()-0.5)*1.5*scale, tH*scale+2*scale, (Math.random()-0.5)*1.5*scale);
    f2.castShadow=true;
    g.add(f2);
  }

  g.position.set(x,0,z);
  scene.add(g);
  collidables.push({type:'circle',x,z,r:1.2*scale});
}

function mkPineTree(x,z){
  const g = new THREE.Group();
  const scale = 0.7+Math.random()*0.6;
  const tH = 2*scale;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1*scale, 0.2*scale, tH, 5),
    new THREE.MeshLambertMaterial({color:0x6b4226,flatShading:true})
  );
  trunk.position.y=tH/2; trunk.castShadow=true;
  g.add(trunk);

  for(let i=0;i<3;i++){
    const r=(2.2-i*0.6)*scale;
    const h=(1.8-i*0.2)*scale;
    const cGeo = new THREE.ConeGeometry(r,h,6+Math.floor(Math.random()*2));
    const cp = cGeo.attributes.position;
    for(let j=0;j<cp.count;j++){
      cp.setX(j,cp.getX(j)+(Math.random()-0.5)*0.25*scale);
      cp.setZ(j,cp.getZ(j)+(Math.random()-0.5)*0.25*scale);
    }
    cGeo.computeVertexNormals();
    const cone = new THREE.Mesh(cGeo,
      new THREE.MeshLambertMaterial({color:i===0?0x2d7a2d:0x3d9a3d, flatShading:true})
    );
    cone.position.y = tH + i*1.0*scale;
    cone.rotation.y=Math.random()*Math.PI;
    cone.castShadow=true;
    g.add(cone);
  }
  g.position.set(x,0,z);
  scene.add(g);
  collidables.push({type:'circle',x,z,r:1.0*scale});
}

function mkTelePole(x,z,rot){
  const g = new THREE.Group();
  const woodMat = new THREE.MeshLambertMaterial({color:0x6b4a30,flatShading:true});

  // main pole - tapered cylinder
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.14,7.5,6), woodMat);
  pole.position.y=3.75; pole.castShadow=true;
  g.add(pole);

  // crossbar
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.08,0.08), woodMat);
  bar.position.y=7.0; g.add(bar);

  // second smaller crossbar
  const bar2 = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.06,0.06), woodMat);
  bar2.position.y=6.4; g.add(bar2);

  // insulators (ceramic look)
  const insMat = new THREE.MeshLambertMaterial({color:0x88aaaa,flatShading:true});
  for(let i=-1;i<=1;i++){
    const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,0.2,5), insMat);
    ins.position.set(i*0.9,7.15,0); g.add(ins);
  }
  for(let i=-1;i<=1;i+=2){
    const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.15,5), insMat);
    ins.position.set(i*0.55,6.52,0); g.add(ins);
  }

  g.position.set(x,0,z);
  g.rotation.y = rot||0;
  scene.add(g);
  collidables.push({type:'circle',x,z,r:0.4});
}

function mkGrassClump(x,z){
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({color:0x55cc33, flatShading:true, side:THREE.DoubleSide});
  const n = 4+Math.floor(Math.random()*6);
  for(let i=0;i<n;i++){
    const h = 0.3+Math.random()*0.5;
    const shape = new THREE.Shape();
    shape.moveTo(-0.06,0); shape.lineTo(0,h); shape.lineTo(0.06,0);
    const blade = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
    blade.position.set((Math.random()-0.5)*1.2, 0, (Math.random()-0.5)*1.2);
    blade.rotation.y = Math.random()*Math.PI;
    g.add(blade);
  }
  g.position.set(x,0.01,z);
  scene.add(g);
}

function mkRock(x,z){
  const geo = new THREE.DodecahedronGeometry(0.4+Math.random()*0.5,0);
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setX(i,p.getX(i)+(Math.random()-0.5)*0.1);
    p.setY(i,p.getY(i)*(0.3+Math.random()*0.3));
    p.setZ(i,p.getZ(i)+(Math.random()-0.5)*0.1);
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:0x888888,flatShading:true}));
  rock.position.set(x,0.15,z);
  rock.rotation.y=Math.random()*6.28;
  rock.castShadow=true;
  scene.add(rock);
  collidables.push({type:'circle',x,z,r:0.6});
}

function mkFence(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1;
  const len=Math.sqrt(dx*dx+dz*dz);
  const ang=Math.atan2(dx,dz);
  const postN=Math.max(2,Math.floor(len/3));
  const mat=new THREE.MeshLambertMaterial({color:0x8b7355,flatShading:true});

  for(let i=0;i<postN;i++){
    const t=i/(postN-1);
    const post=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.8,0.08),mat);
    post.position.set(x1+dx*t, 0.4, z1+dz*t);
    post.castShadow=true;
    scene.add(post);
  }
  // rails
  for(let h=0.3;h<=0.7;h+=0.4){
    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,len),mat);
    rail.position.set((x1+x2)/2, h, (z1+z2)/2);
    rail.rotation.y=ang;
    scene.add(rail);
  }
}

function mkHouse(x,z,rot){
  const g=new THREE.Group();
  const wallCols = [0xddc8a0,0xc4a882,0xb8d4c8,0xd4b89a,0xccc0a8,0xe0d0b8];
  const roofCols = [0x884433,0x664422,0x995544,0x775533,0x553322];
  const wallCol = wallCols[Math.floor(Math.random()*wallCols.length)];
  const roofCol = roofCols[Math.floor(Math.random()*roofCols.length)];
  const wallMat = new THREE.MeshLambertMaterial({color:wallCol,flatShading:true});
  const roofMat = new THREE.MeshLambertMaterial({color:roofCol,flatShading:true});
  const trimMat = new THREE.MeshLambertMaterial({color:0xf0ece0,flatShading:true});
  const doorMat = new THREE.MeshLambertMaterial({color:0x664422,flatShading:true});
  const glassMat = new THREE.MeshLambertMaterial({color:0x88bbdd,flatShading:true,emissive:0x223344});

  const w=5+Math.random()*2, d=4.5+Math.random()*1.5, h=2.8+Math.random()*0.5;

  // main walls
  const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat);
  wall.position.y=h/2; wall.castShadow=true; wall.receiveShadow=true;
  g.add(wall);

  // foundation strip
  const found=new THREE.Mesh(new THREE.BoxGeometry(w+0.1,0.3,d+0.1),
    new THREE.MeshLambertMaterial({color:0x888880,flatShading:true}));
  found.position.y=0.15; g.add(found);

  // roof (proper triangular prism)
  const roofW=w*0.58, roofH=1.8, roofD=d+0.6;
  const rv = new Float32Array([
    -roofW,0,-roofD/2, roofW,0,-roofD/2, 0,roofH,-roofD/2,
    -roofW,0,roofD/2, 0,roofH,roofD/2, roofW,0,roofD/2,
    -roofW,0,-roofD/2, 0,roofH,-roofD/2, 0,roofH,roofD/2,
    -roofW,0,-roofD/2, 0,roofH,roofD/2, -roofW,0,roofD/2,
    roofW,0,-roofD/2, roofW,0,roofD/2, 0,roofH,roofD/2,
    roofW,0,-roofD/2, 0,roofH,roofD/2, 0,roofH,-roofD/2,
    -roofW,0,-roofD/2, -roofW,0,roofD/2, roofW,0,roofD/2,
    -roofW,0,-roofD/2, roofW,0,roofD/2, roofW,0,-roofD/2,
  ]);
  const rGeo=new THREE.BufferGeometry();
  rGeo.setAttribute('position',new THREE.BufferAttribute(rv,3));
  rGeo.computeVertexNormals();
  const roof=new THREE.Mesh(rGeo,roofMat);
  roof.position.y=h; roof.castShadow=true;
  g.add(roof);

  // roof overhang trim
  const trimGeo=new THREE.BoxGeometry(w+0.4,0.08,d+0.5);
  const trim=new THREE.Mesh(trimGeo, trimMat);
  trim.position.y=h; g.add(trim);

  // chimney
  if(Math.random()>0.3){
    const chimW=0.5,chimD=0.4,chimH=2.2;
    const chim=new THREE.Mesh(new THREE.BoxGeometry(chimW,chimH,chimD),
      new THREE.MeshLambertMaterial({color:0x884444,flatShading:true}));
    chim.position.set(w*0.25, h+chimH/2-0.3, 0);
    chim.castShadow=true;
    g.add(chim);
    // chimney cap
    const cap=new THREE.Mesh(new THREE.BoxGeometry(chimW+0.1,0.08,chimD+0.1),
      new THREE.MeshLambertMaterial({color:0x666666,flatShading:true}));
    cap.position.set(w*0.25, h+chimH-0.3+0.04, 0);
    g.add(cap);
  }

  // front door
  const doorW=0.9, doorH=1.7;
  const door=new THREE.Mesh(new THREE.BoxGeometry(doorW,doorH,0.08), doorMat);
  door.position.set(0, doorH/2, d/2+0.04);
  g.add(door);

  // door frame
  const dfTop=new THREE.Mesh(new THREE.BoxGeometry(doorW+0.15,0.08,0.1), trimMat);
  dfTop.position.set(0, doorH+0.04, d/2+0.04); g.add(dfTop);
  for(let s=-1;s<=1;s+=2){
    const dfSide=new THREE.Mesh(new THREE.BoxGeometry(0.06,doorH,0.1), trimMat);
    dfSide.position.set(s*(doorW/2+0.03), doorH/2, d/2+0.04); g.add(dfSide);
  }

  // door handle
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.12,0.06),
    new THREE.MeshLambertMaterial({color:0xbbaa44,flatShading:true}));
  handle.position.set(0.3, doorH*0.5, d/2+0.1); g.add(handle);

  // doorstep
  const step=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.12,0.5),
    new THREE.MeshLambertMaterial({color:0x999990,flatShading:true}));
  step.position.set(0, 0.06, d/2+0.25); g.add(step);

  // windows - front (beside door)
  for(let s=-1;s<=1;s+=2){
    const winW=0.7, winH=0.65;
    const win=new THREE.Mesh(new THREE.BoxGeometry(winW,winH,0.06), glassMat);
    win.position.set(s*1.4, h*0.55, d/2+0.04); g.add(win);
    // window frame
    const wfT=new THREE.Mesh(new THREE.BoxGeometry(winW+0.1,0.05,0.08), trimMat);
    wfT.position.set(s*1.4, h*0.55+winH/2+0.025, d/2+0.04); g.add(wfT);
    const wfB=new THREE.Mesh(new THREE.BoxGeometry(winW+0.1,0.06,0.1), trimMat);
    wfB.position.set(s*1.4, h*0.55-winH/2-0.03, d/2+0.05); g.add(wfB);
    // window cross
    const wCross=new THREE.Mesh(new THREE.BoxGeometry(winW,0.03,0.07), trimMat);
    wCross.position.set(s*1.4, h*0.55, d/2+0.05); g.add(wCross);
    const wCrossV=new THREE.Mesh(new THREE.BoxGeometry(0.03,winH,0.07), trimMat);
    wCrossV.position.set(s*1.4, h*0.55, d/2+0.05); g.add(wCrossV);
    // shutters
    for(let sh=-1;sh<=1;sh+=2){
      const shutter=new THREE.Mesh(new THREE.BoxGeometry(0.12,winH+0.05,0.04),
        new THREE.MeshLambertMaterial({color:0x446644,flatShading:true}));
      shutter.position.set(s*1.4+sh*(winW/2+0.08), h*0.55, d/2+0.06); g.add(shutter);
    }
  }

  // side windows
  for(let s=-1;s<=1;s+=2){
    for(let i=0;i<2;i++){
      const winW=0.6, winH=0.55;
      const win=new THREE.Mesh(new THREE.BoxGeometry(0.06,winH,winW), glassMat);
      win.position.set(s*(w/2+0.03), h*0.55, -d*0.15+i*d*0.4); g.add(win);
      // frame
      const wf=new THREE.Mesh(new THREE.BoxGeometry(0.08,winH+0.1,winW+0.1), trimMat);
      wf.position.set(s*(w/2+0.02), h*0.55, -d*0.15+i*d*0.4); g.add(wf);
    }
  }

  // porch awning (small overhang above door)
  const awning=new THREE.Mesh(new THREE.BoxGeometry(2.0,0.06,0.8), roofMat);
  awning.position.set(0, doorH+0.2, d/2+0.4); awning.rotation.x=0.1;
  g.add(awning);

  // porch posts
  for(let s=-1;s<=1;s+=2){
    const pp=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,doorH+0.2,5), trimMat);
    pp.position.set(s*0.9, (doorH+0.2)/2, d/2+0.7); g.add(pp);
  }

  g.position.set(x,0,z);
  g.rotation.y=rot||0;
  scene.add(g);
  collidables.push({type:'circle',x,z,r:Math.max(w,d)*0.6});
}

/* ═══════════════════════════════════════════
   BUILD WORLD
   ═══════════════════════════════════════════ */
function buildWorld(){
  // ground plane
  const gGeo = new THREE.PlaneGeometry(1600,1600,60,60);
  const gp = gGeo.attributes.position;
  for(let i=0;i<gp.count;i++){
    gp.setZ(i, gp.getZ(i) + (Math.random()-0.5)*0.2);
  }
  gGeo.computeVertexNormals();
  const ground = new THREE.Mesh(gGeo, new THREE.MeshLambertMaterial({color:0x5c9a3a, flatShading:true}));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow=true;
  scene.add(ground);

  /* ── INTERSECTIONS (define first so roads know where to skip barriers) ── */
  addIntersection(0, 0, 16);
  addIntersection(0, -150, 16);
  addIntersection(0, 150, 16);
  addIntersection(0, 300, 16);
  addIntersection(0, -300, 16);
  addIntersection(150, 0, 16);
  addIntersection(-150, 0, 16);
  addIntersection(300, 0, 16);
  addIntersection(-300, 0, 16);
  addIntersection(150, -150, 16);
  addIntersection(-150, 150, 16);
  addIntersection(150, 150, 16);
  addIntersection(-150, -150, 16);
  addIntersection(300, 150, 16);
  addIntersection(-300, -150, 16);
  addIntersection(300, -150, 16);
  addIntersection(-150, 300, 16);
  addIntersection(150, -300, 16);

  /* ── ROADS ── */
  // Main E-W highway
  buildStraightRoad(-500,0, 500,0, 12);

  // Main N-S highway
  buildStraightRoad(0,-450, 0,450, 12);

  // East-West secondaries
  buildStraightRoad(-400, 150, 400, 150);
  buildStraightRoad(-400, -150, 400, -150);

  // North-South secondaries
  buildStraightRoad(150, -400, 150, 250);
  buildStraightRoad(-150, -250, -150, 400);

  // Diagonal road NE
  const diagNE=[];
  for(let i=0;i<=20;i++){
    const t=i/20;
    diagNE.push({x:150+t*150, z:-150-t*150});
  }
  buildCurvedRoad(diagNE, 9);

  // Long curving road south
  buildStraightRoad(0, 300, -150, 300);

  // Ring road east
  buildStraightRoad(300, -200, 300, 200);
  buildStraightRoad(300, 150, 400, 150);
  buildStraightRoad(300, -150, 400, -150);

  // Ring road west
  buildStraightRoad(-300, -200, -300, 0);
  buildStraightRoad(-300, 0, -400, 0);
  buildStraightRoad(-300, -150, -400, -150);

  // Curved scenic road SE
  const scenic=[];
  for(let i=0;i<=25;i++){
    const t=i/25;
    scenic.push({
      x: 200+Math.cos(t*Math.PI*0.6)*100,
      z: 200+Math.sin(t*Math.PI*0.6)*100
    });
  }
  buildCurvedRoad(scenic, 8);

  // Winding country road NW
  const country=[];
  for(let i=0;i<=30;i++){
    const t=i/30;
    country.push({
      x: -200-t*150,
      z: 100+Math.sin(t*Math.PI*1.5)*50
    });
  }
  buildCurvedRoad(country, 8);

  // Small connecting roads
  buildStraightRoad(150, 150, 300, 150);
  buildStraightRoad(150, -300, 0, -300);

  /* ── ENVIRONMENT ── */
  const rng = (a,b) => a + Math.random()*(b-a);
  const notOnRoad = (x,z) => {
    for(const s of roadSegs){
      const dx=s.x2-s.x1, dz=s.z2-s.z1;
      const len=Math.sqrt(dx*dx+dz*dz);
      const nx=-dz/len, nz=dx/len;
      const t=((x-s.x1)*dx+(z-s.z1)*dz)/(len*len);
      if(t<-0.02||t>1.02) continue;
      const px=s.x1+dx*t, pz=s.z1+dz*t;
      const dist=Math.abs((x-px)*nx+(z-pz)*nz);
      if(dist < s.w/2+4) return false;
    }
    for(const it of intersections){
      if(Math.abs(x-it.x)<it.size/2+3 && Math.abs(z-it.z)<it.size/2+3) return false;
    }
    return true;
  };

  // Autumn trees (round, like reference) - lots of them
  for(let i=0;i<180;i++){
    const x=rng(-550,550), z=rng(-550,550);
    if(!notOnRoad(x,z)) continue;
    mkTree(x,z, Math.floor(Math.random()*4));
  }

  // Pine trees
  for(let i=0;i<60;i++){
    const x=rng(-550,550), z=rng(-550,550);
    if(!notOnRoad(x,z)) continue;
    mkPineTree(x,z);
  }

  // Telephone poles along main roads
  for(let i=-8;i<=8;i++){
    if(i===0) continue;
    mkTelePole(i*50, ROAD_W/2+5, 0);
  }
  for(let i=-6;i<=6;i++){
    if(i===0) continue;
    mkTelePole(ROAD_W/2+5, i*55, Math.PI/2);
  }
  // Poles along secondary
  for(let i=-5;i<=5;i++){
    if(i===0) continue;
    mkTelePole(i*50, 150+ROAD_W/2+5, 0);
    mkTelePole(i*50, -150-ROAD_W/2-5, 0);
  }

  // Grass clumps
  for(let i=0;i<350;i++){
    const x=rng(-500,500), z=rng(-500,500);
    if(!notOnRoad(x,z)) continue;
    mkGrassClump(x,z);
  }

  // Rocks
  for(let i=0;i<40;i++){
    const x=rng(-450,450), z=rng(-450,450);
    if(!notOnRoad(x,z)) continue;
    mkRock(x,z);
  }

  // Houses / buildings
  const houseSpots = [
    [30,40,0], [-40,30,1.5], [50,-40,0.5], [-30,-50,2],
    [180,30,0], [180,-30,1], [-180,30,3], [-180,-30,2],
    [40,180,0], [-50,180,1.5], [40,-180,0.5], [-50,-180,2],
    [180,180,0.8], [-180,180,2.2], [330,30,0], [330,-30,1.5],
    [-330,30,3], [-330,-30,0.5], [50,330,1], [-50,330,2],
    [170,-180,0], [-170,-180,1.5],
  ];
  for(const [hx,hz,hr] of houseSpots){
    if(!notOnRoad(hx,hz)) continue;
    mkHouse(hx,hz,hr);
  }

  // Fences near some houses
  mkFence(25,55, 55,55);
  mkFence(55,55, 55,25);
  mkFence(-55,25, -55,55);
  mkFence(-55,55, -25,55);
  mkFence(170,50, 195,50);
  mkFence(195,50, 195,20);
}

/* ═══════════════════════════════════════════
   CAR (BMW E30 style - detailed low poly)
   ═══════════════════════════════════════════ */
function buildCar(){
  car = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({color:0xcc2200,flatShading:true});
  const darkRed = new THREE.MeshLambertMaterial({color:0xaa1a00,flatShading:true});
  const white = new THREE.MeshLambertMaterial({color:0xf0f0f0,flatShading:true});
  const dark = new THREE.MeshLambertMaterial({color:0x1a1a1a,flatShading:true});
  const chrome = new THREE.MeshLambertMaterial({color:0xbbbbbb,flatShading:true});
  const glass = new THREE.MeshLambertMaterial({color:0x223355,flatShading:true,transparent:true,opacity:0.65});
  const hlMat = new THREE.MeshLambertMaterial({color:0xffffdd,emissive:0x555533,flatShading:true});
  const tlMat = new THREE.MeshLambertMaterial({color:0xdd1111,emissive:0x441111,flatShading:true});
  const goldRim = new THREE.MeshLambertMaterial({color:0xc4a030,flatShading:true});
  const darkGold = new THREE.MeshLambertMaterial({color:0x9a7a20,flatShading:true});
  const tireMat = new THREE.MeshLambertMaterial({color:0x1a1a1a,flatShading:true});

  // ── main body - shaped with custom geometry for proper E30 profile ──
  // lower body (wide, boxy)
  const lb=new THREE.Mesh(new THREE.BoxGeometry(1.82,0.40,4.1),red);
  lb.position.y=0.30; lb.castShadow=true; car.add(lb);

  // upper body / belt line (slightly narrower)
  const ub=new THREE.Mesh(new THREE.BoxGeometry(1.76,0.18,4.0),red);
  ub.position.y=0.55; ub.castShadow=true; car.add(ub);

  // hood panel (front, slightly sloped)
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.72,0.04,1.65),red);
  hood.position.set(0,0.64,0.82); hood.rotation.x=-0.03; car.add(hood);

  // trunk panel (rear, flat)
  const trunk=new THREE.Mesh(new THREE.BoxGeometry(1.72,0.04,0.9),red);
  trunk.position.set(0,0.64,-1.5); car.add(trunk);

  // white racing stripe - hood
  const strH=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,1.67),white);
  strH.position.set(0,0.645,0.82); strH.rotation.x=-0.03; car.add(strH);

  // white racing stripe - roof
  const strR=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.02,1.5),white);
  strR.position.set(0,1.06,-0.35); car.add(strR);

  // white racing stripe - trunk
  const strT=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.92),white);
  strT.position.set(0,0.645,-1.5); car.add(strT);

  // white side stripe (belt line)
  for(let s=-1;s<=1;s+=2){
    const ss=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.08,3.6),white);
    ss.position.set(s*0.90,0.48,0); car.add(ss);
  }

  // ── Cabin (proper windshield angle) ──
  // A-pillar to C-pillar: trapezoidal cabin
  const cW=0.76, cH=0.42, cFZ=0.35, cRZ=-1.15;
  const windA = 0.22; // windshield recessed from cabin front
  // front pillars (A-pillars)
  for(let s=-1;s<=1;s+=2){
    const pil=new THREE.Mesh(new THREE.BoxGeometry(0.06,cH+0.1,0.06),red);
    pil.position.set(s*cW, 0.64+cH/2, cFZ-windA);
    pil.rotation.z=s*0.08; pil.rotation.x=-0.3;
    car.add(pil);
  }

  // roof panel
  const roofL=cFZ-windA-(cRZ)+0.1;
  const roofMesh=new THREE.Mesh(new THREE.BoxGeometry(cW*2,0.04,1.3),red);
  roofMesh.position.set(0, 0.64+cH, (cFZ-windA+cRZ)/2);
  roofMesh.castShadow=true; car.add(roofMesh);

  // rear pillars (C-pillars)
  for(let s=-1;s<=1;s+=2){
    const pil=new THREE.Mesh(new THREE.BoxGeometry(0.06,cH+0.1,0.06),red);
    pil.position.set(s*cW, 0.64+cH/2, cRZ);
    pil.rotation.z=s*(-0.05); pil.rotation.x=0.2;
    car.add(pil);
  }

  // B-pillar
  for(let s=-1;s<=1;s+=2){
    const bp=new THREE.Mesh(new THREE.BoxGeometry(0.04,cH,0.04),dark);
    bp.position.set(s*(cW+0.01), 0.64+cH/2, -0.35);
    car.add(bp);
  }

  // windshield
  const ws=new THREE.Mesh(new THREE.PlaneGeometry(cW*1.9,cH+0.05),glass);
  ws.position.set(0,0.64+cH/2,cFZ); ws.rotation.x=-1.15; car.add(ws);

  // rear window
  const rw=new THREE.Mesh(new THREE.PlaneGeometry(cW*1.85,cH*0.8),glass);
  rw.position.set(0,0.64+cH/2,cRZ); rw.rotation.x=0.45; car.add(rw);

  // side windows (front)
  for(let s=-1;s<=1;s+=2){
    const sw=new THREE.Mesh(new THREE.PlaneGeometry(0.75,cH*0.75),glass);
    sw.position.set(s*(cW+0.01),0.64+cH/2, -0.0); sw.rotation.y=s*Math.PI/2;
    car.add(sw);
  }
  // side windows (rear quarter)
  for(let s=-1;s<=1;s+=2){
    const sw=new THREE.Mesh(new THREE.PlaneGeometry(0.55,cH*0.65),glass);
    sw.position.set(s*(cW+0.01),0.64+cH/2, -0.7); sw.rotation.y=s*Math.PI/2;
    car.add(sw);
  }

  // ── Front face ──
  // front panel (nose)
  const nose=new THREE.Mesh(new THREE.BoxGeometry(1.82,0.35,0.06),red);
  nose.position.set(0,0.40,2.02); car.add(nose);

  // bumper (chrome-ish with rubber strip)
  const bumperF=new THREE.Mesh(new THREE.BoxGeometry(1.88,0.12,0.14),chrome);
  bumperF.position.set(0,0.18,2.06); car.add(bumperF);
  const bumperRub=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.16),dark);
  bumperRub.position.set(0,0.18,2.08); car.add(bumperRub);

  // kidney grilles
  for(let s=-1;s<=1;s+=2){
    const gBg=new THREE.Mesh(new THREE.BoxGeometry(0.32,0.20,0.03),dark);
    gBg.position.set(s*0.24,0.43,2.05); car.add(gBg);
    const gFrame=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.23,0.02),chrome);
    gFrame.position.set(s*0.24,0.43,2.04); car.add(gFrame);
    // horizontal slats
    for(let i=0;i<4;i++){
      const sl=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.012,0.01),chrome);
      sl.position.set(s*0.24,0.36+i*0.045,2.07); car.add(sl);
    }
  }

  // headlights (quad round - E30 signature)
  for(let s=-1;s<=1;s+=2){
    // outer (bigger)
    const hlBez=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.04,10),chrome);
    hlBez.rotation.x=Math.PI/2; hlBez.position.set(s*0.68,0.43,2.04); car.add(hlBez);
    const hlLens=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.03,10),hlMat);
    hlLens.rotation.x=Math.PI/2; hlLens.position.set(s*0.68,0.43,2.06); car.add(hlLens);
    // inner (smaller)
    const hlBez2=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.10,0.04,10),chrome);
    hlBez2.rotation.x=Math.PI/2; hlBez2.position.set(s*0.46,0.43,2.04); car.add(hlBez2);
    const hlLens2=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.03,10),hlMat);
    hlLens2.rotation.x=Math.PI/2; hlLens2.position.set(s*0.46,0.43,2.06); car.add(hlLens2);
  }

  // turn signals (front corners)
  for(let s=-1;s<=1;s+=2){
    const ts=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.06,0.04),
      new THREE.MeshLambertMaterial({color:0xffaa22,emissive:0x332200,flatShading:true}));
    ts.position.set(s*0.88,0.35,2.04); car.add(ts);
  }

  // ── Rear face ──
  const rearPanel=new THREE.Mesh(new THREE.BoxGeometry(1.82,0.35,0.06),red);
  rearPanel.position.set(0,0.40,-2.02); car.add(rearPanel);

  // rear bumper
  const bumperR=new THREE.Mesh(new THREE.BoxGeometry(1.88,0.12,0.14),chrome);
  bumperR.position.set(0,0.18,-2.06); car.add(bumperR);
  const bumperRubR=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,0.16),dark);
  bumperRubR.position.set(0,0.18,-2.08); car.add(bumperRubR);

  // tail lights (wide, rectangular E30 style)
  for(let s=-1;s<=1;s+=2){
    const tlOuter=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.12,0.04),tlMat);
    tlOuter.position.set(s*0.72,0.42,-2.05); car.add(tlOuter);
    const tlInner=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.12,0.04),
      new THREE.MeshLambertMaterial({color:0xff6622,emissive:0x331100,flatShading:true}));
    tlInner.position.set(s*0.54,0.42,-2.05); car.add(tlInner);
    // tail light chrome frame
    const tlFrame=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.15,0.03),chrome);
    tlFrame.position.set(s*0.63,0.42,-2.04); car.add(tlFrame);
  }

  // license plate (rear)
  const plate=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.10,0.02),white);
  plate.position.set(0,0.30,-2.06); car.add(plate);
  const plateBord=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.12,0.015),dark);
  plateBord.position.set(0,0.30,-2.055); car.add(plateBord);

  // ── Side details ──
  // side mirrors
  for(let s=-1;s<=1;s+=2){
    const mArm=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.02,0.02),dark);
    mArm.position.set(s*0.97,0.68,0.5); car.add(mArm);
    const mHead=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.08,0.10),dark);
    mHead.position.set(s*1.06,0.68,0.5); car.add(mHead);
    const mGlass=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.06,0.08),chrome);
    mGlass.position.set(s*1.09,0.68,0.5); car.add(mGlass);
  }

  // door seam lines
  for(let s=-1;s<=1;s+=2){
    const dl=new THREE.Mesh(new THREE.BoxGeometry(0.005,0.30,1.3),darkRed);
    dl.position.set(s*0.912,0.42,-0.1); car.add(dl);
  }

  // fender flares (over each wheel arch)
  for(let s=-1;s<=1;s+=2){
    for(let fb=-1;fb<=1;fb+=2){
      const flare=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,0.70),darkRed);
      flare.position.set(s*0.94,0.32,fb*1.25); car.add(flare);
      // wheel arch lip
      const lip=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.04,0.72),dark);
      lip.position.set(s*0.96,0.42,fb*1.25); car.add(lip);
    }
  }

  // door handle
  for(let s=-1;s<=1;s+=2){
    const dh=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.03,0.12),chrome);
    dh.position.set(s*0.92,0.52,0.0); car.add(dh);
  }

  // exhaust tips
  for(let i=0;i<2;i++){
    const ex=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.04,0.14,6),chrome);
    ex.rotation.x=Math.PI/2; ex.position.set(0.3+i*0.22,0.14,-2.12); car.add(ex);
    const exInner=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.03,0.06,6),dark);
    exInner.rotation.x=Math.PI/2; exInner.position.set(0.3+i*0.22,0.14,-2.16); car.add(exInner);
  }

  // antenna
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.004,0.65,3),dark);
  ant.position.set(0.55,1.3,-0.7); ant.rotation.z=-0.12; car.add(ant);

  // ── Wheels (detailed low poly) ──
  car.wheels=[];
  const wps=[{x:-0.84,z:1.22},{x:0.84,z:1.22},{x:-0.84,z:-1.22},{x:0.84,z:-1.22}];
  for(const wp of wps){
    const wg=new THREE.Group();
    const isLeft = wp.x < 0;

    // inner group that spins
    const spin=new THREE.Group();

    // tire
    const tireOuter=new THREE.Mesh(new THREE.TorusGeometry(0.24,0.09,6,12),tireMat);
    tireOuter.rotation.y=Math.PI/2;
    spin.add(tireOuter);

    // rim disk (flat cylinder facing outward)
    const rimDish=new THREE.Mesh(new THREE.CylinderGeometry(0.20,0.20,0.14,10),goldRim);
    rimDish.rotation.x=Math.PI/2;
    spin.add(rimDish);

    // rim lip
    const rimLip=new THREE.Mesh(new THREE.TorusGeometry(0.20,0.015,4,10),goldRim);
    rimLip.rotation.y=Math.PI/2;
    spin.add(rimLip);

    // 5 spokes
    for(let sp=0;sp<5;sp++){
      const ang=(sp/5)*Math.PI*2;
      const spoke=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.04,0.18),darkGold);
      spoke.position.set(0, Math.sin(ang)*0.10, Math.cos(ang)*0.10);
      spoke.rotation.z=ang;
      spin.add(spoke);
    }

    // center cap
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.16,6),
      new THREE.MeshLambertMaterial({color:0x887744,flatShading:true}));
    cap.rotation.x=Math.PI/2; spin.add(cap);

    // lug nuts
    for(let ln=0;ln<5;ln++){
      const ang=(ln/5)*Math.PI*2;
      const lug=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.16,4),chrome);
      lug.rotation.x=Math.PI/2;
      lug.position.set(0, Math.sin(ang)*0.06, Math.cos(ang)*0.06);
      spin.add(lug);
    }

    wg.add(spin);
    wg.position.set(wp.x,0.30,wp.z);
    car.add(wg); car.wheels.push(wg);
  }

  car.position.copy(P.pos);
  scene.add(car);
}

/* ═══════════════════════════════════════════
   PHYSICS
   ═══════════════════════════════════════════ */
function resetCar(){
  P.vel.set(0,0,0); P.angVel=0; P.rpm=CAR.idle; P.speed=0;
  P.pitch=0; P.roll=0; P.pVel=0; P.rVel=0; P.drift=0;
  P.pos.y = ROAD_Y + 0.30;
}

function getGroundHeight(x,z){
  // check if on any road segment
  for(const s of roadSegs){
    const dx=s.x2-s.x1, dz=s.z2-s.z1;
    const len=Math.sqrt(dx*dx+dz*dz);
    const t=((x-s.x1)*dx+(z-s.z1)*dz)/(len*len);
    if(t<-0.01||t>1.01) continue;
    const px=s.x1+dx*t, pz=s.z1+dz*t;
    const nx=-dz/len, nz=dx/len;
    const dist=Math.abs((x-px)*nx+(z-pz)*nz);
    if(dist < s.w/2+1.5) return ROAD_Y;
  }
  for(const it of intersections){
    if(Math.abs(x-it.x)<it.size/2+2 && Math.abs(z-it.z)<it.size/2+2) return ROAD_Y;
  }
  return 0;
}

function updatePhysics(dt){
  if(!playing) return;
  dt=Math.min(dt, 1/30);

  const thr=(keys.KeyW||keys.ArrowUp)?1:0;
  const brk=(keys.KeyS||keys.ArrowDown)?1:0;
  const str=((keys.KeyA||keys.ArrowLeft)?-1:0)+((keys.KeyD||keys.ArrowRight)?1:0);
  const hb=keys.Space?1:0;

  const fX=Math.sin(P.head), fZ=Math.cos(P.head);
  const rX=Math.cos(P.head), rZ=-Math.sin(P.head);

  P.speed = P.vel.x*fX + P.vel.z*fZ;
  const latSpd = P.vel.x*rX + P.vel.z*rZ;

  // steering
  const sFac=1/(1+Math.abs(P.speed)*0.04);
  const tgtS=str*CAR.maxSteer*sFac;
  if(str!==0) P.wAngle+=(tgtS-P.wAngle)*CAR.steerSpd*dt*5;
  else P.wAngle*=Math.exp(-CAR.steerRet*dt*5);
  P.wAngle=THREE.MathUtils.clamp(P.wAngle,-CAR.maxSteer,CAR.maxSteer);

  // engine
  const gR=CAR.gears[P.gear]*CAR.final;
  const wSpd=Math.abs(P.speed)/CAR.wheelR;
  P.rpm=Math.max(CAR.idle, wSpd*gR*60/(2*Math.PI));
  if(P.rpm>CAR.upShift && P.gear<CAR.gears.length-1) P.gear++;
  if(P.rpm<CAR.downShift && P.gear>1 && P.speed>5) P.gear--;
  P.rpm=Math.min(P.rpm,CAR.maxRPM);

  const rN=P.rpm/CAR.maxRPM;
  const tCurve=1-Math.pow(rN-0.55,2)*2.5;
  const eForce=thr*CAR.torque*tCurve*gR/CAR.wheelR;

  // tire
  P.slip=Math.abs(P.speed)>1?Math.atan2(latSpd,Math.abs(P.speed)):0;
  const acG=eForce/CAR.mass;
  const wF=0.5-(acG*CAR.cgH/CAR.wb)*0.1;
  const wR=1-wF;
  const dfN=CAR.downforce*P.speed*P.speed;
  const tW=CAR.mass*9.81+dfN;
  let gF=CAR.gripF*tW*wF, gR2=CAR.gripR*tW*wR;

  if(hb){ gR2*=0.3; P.drift=Math.min(1,P.drift+dt*3); }
  else P.drift=Math.max(0,P.drift-dt*2);

  const cFF=-P.slip*CAR.csF*gF;
  const cFR=-P.slip*CAR.csR*gR2*(1-P.drift*0.5);
  const mLF=gF*0.85, mLR=gR2*0.85;
  const lFF=THREE.MathUtils.clamp(cFF,-mLF,mLF);
  const lFR=THREE.MathUtils.clamp(cFR,-mLR,mLR);

  let dF=eForce, bF=0;
  if(brk>0){
    if(P.speed>1) bF=CAR.brakeF*brk;
    else if(P.speed>-15) dF=-CAR.torque*0.4*brk*gR/CAR.wheelR;
  }
  if(hb) bF+=CAR.hbrakeF;

  const drag=CAR.drag*P.speed*Math.abs(P.speed);
  const rll=CAR.roll*P.speed;
  const longF=dF-bF*Math.sign(P.speed)-drag-rll;
  const latF=lFF+lFR;

  P.vel.x += (longF*fX+latF*rX)/CAR.mass*dt;
  P.vel.z += (longF*fZ+latF*rZ)/CAR.mass*dt;

  // yaw
  if(Math.abs(P.speed)>0.5){
    const tR=CAR.wb/Math.tan(Math.abs(P.wAngle)+0.001);
    const yR=P.speed/tR*Math.sign(P.wAngle);
    const sY=(lFR-lFF)/CAR.mass*0.001*Math.sign(P.speed);
    P.angVel=yR+sY;
  } else P.angVel*=0.95;

  P.head+=P.angVel*dt;
  P.pos.x+=P.vel.x*dt;
  P.pos.z+=P.vel.z*dt;

  // ground
  const gH = getGroundHeight(P.pos.x, P.pos.z);
  const targetY = gH + 0.30;

  // smooth transition between road and ground
  P.vel.y -= 9.81*dt;
  P.pos.y += P.vel.y*dt;

  if(P.pos.y < targetY){
    P.pos.y = targetY;
    P.vel.y = 0;
  }

  // pitch/roll
  const tP=-acG*0.025;
  const tR2=-P.angVel*P.speed*0.006;
  P.pVel+=(tP-P.pitch)*30*dt - P.pVel*6*dt;
  P.rVel+=(tR2-P.roll)*30*dt - P.rVel*6*dt;
  P.pitch+=P.pVel*dt;
  P.roll+=P.rVel*dt;

  // collisions
  for(const c of collidables){
    if(c.type==='circle'){
      const dx=P.pos.x-c.x, dz=P.pos.z-c.z;
      const d=Math.sqrt(dx*dx+dz*dz);
      const minD=c.r+1.1;
      if(d<minD && d>0.01){
        const nx=dx/d,nz=dz/d;
        P.pos.x=c.x+nx*minD; P.pos.z=c.z+nz*minD;
        const vn=P.vel.x*nx+P.vel.z*nz;
        if(vn<0){P.vel.x-=vn*nx*1.4;P.vel.z-=vn*nz*1.4;P.vel.x*=0.82;P.vel.z*=0.82;}
      }
    } else if(c.type==='line'){
      const dx=P.pos.x-c.x1,dz=P.pos.z-c.z1;
      const ex=c.x2-c.x1,ez=c.z2-c.z1;
      const t=Math.max(0,Math.min(1,(dx*ex+dz*ez)/(c.len*c.len)));
      const cx2=c.x1+ex*t, cz2=c.z1+ez*t;
      const ddx=P.pos.x-cx2,ddz=P.pos.z-cz2;
      const dist=Math.sqrt(ddx*ddx+ddz*ddz);
      if(dist<1.3 && dist>0.01){
        const nx=ddx/dist,nz=ddz/dist;
        P.pos.x=cx2+nx*1.3; P.pos.z=cz2+nz*1.3;
        const vn=P.vel.x*nx+P.vel.z*nz;
        if(vn<0){P.vel.x-=vn*nx*1.4;P.vel.z-=vn*nz*1.4;P.vel.x*=0.85;P.vel.z*=0.85;}
      }
    }
  }
}

/* ═══════════════════════════════════════════
   RENDER LOOP
   ═══════════════════════════════════════════ */
const camS={x:0,y:4,z:-8};

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  if(!playing){
    menuCamAngle += dt * 0.15;
    const r = 60, h = 25;
    cam.position.set(Math.cos(menuCamAngle)*r, h, Math.sin(menuCamAngle)*r);
    cam.lookAt(0, 2, 0);
    renderer.render(scene, cam);
    return;
  }

  updatePhysics(dt);

  // car visual
  car.position.copy(P.pos);
  car.rotation.set(P.pitch, P.head, P.roll);
  const wRot=P.speed/CAR.wheelR;
  car.wheels.forEach((w,i)=>{
    w.children[0].rotation.x+=wRot*dt;
    if(i<2) w.rotation.y=P.wAngle;
  });

  // camera
  const fX=Math.sin(P.head), fZ=Math.cos(P.head);
  if(camMode===0){
    const d=6.5+Math.abs(P.speed)*0.018;
    const h=2.8+Math.abs(P.speed)*0.004;
    const tx=P.pos.x-fX*d, ty=P.pos.y+h, tz=P.pos.z-fZ*d;
    camS.x+=(tx-camS.x)*0.055; camS.y+=(ty-camS.y)*0.07; camS.z+=(tz-camS.z)*0.055;
    cam.position.set(camS.x,camS.y,camS.z);
    cam.lookAt(P.pos.x+fX*4, P.pos.y+0.4, P.pos.z+fZ*4);
  } else if(camMode===1){
    cam.position.set(P.pos.x+fX*1.2, P.pos.y+1.0, P.pos.z+fZ*1.2);
    cam.lookAt(P.pos.x+fX*20, P.pos.y+0.6, P.pos.z+fZ*20);
  } else {
    const a=performance.now()*0.0003+P.head;
    cam.position.set(P.pos.x+Math.cos(a)*9, P.pos.y+3, P.pos.z+Math.sin(a)*9);
    cam.lookAt(P.pos);
  }

  // HUD
  document.getElementById('speed-val').textContent=Math.round(Math.abs(P.speed*3.6));
  const rPct=((P.rpm-CAR.idle)/(CAR.maxRPM-CAR.idle))*100;
  const rf=document.getElementById('rpm-fill');
  rf.style.width=rPct+'%';
  rf.style.background=P.rpm>6000
    ?`linear-gradient(90deg,#44ff44 0%,#ff4444 ${rPct}%)`
    :`linear-gradient(90deg,#44ff44 0%,#ffaa00 ${rPct}%)`;
  document.getElementById('rpm-txt').textContent=Math.round(P.rpm)+' RPM';
  document.getElementById('gear-val').textContent=P.gear===0?'N':P.gear;

  // minimap
  const mc=document.getElementById('mm');
  const mx=mc.getContext('2d');
  mx.clearRect(0,0,160,160);
  const ms=0.12;
  const mo_x=80-P.pos.x*ms, mo_z=80-P.pos.z*ms;

  mx.strokeStyle='rgba(120,120,140,0.5)';mx.lineWidth=2;
  for(const s of roadSegs){
    const sx1=mo_x+s.x1*ms, sz1=mo_z+s.z1*ms;
    const sx2=mo_x+s.x2*ms, sz2=mo_z+s.z2*ms;
    mx.beginPath();mx.moveTo(sx1,sz1);mx.lineTo(sx2,sz2);mx.stroke();
  }

  mx.fillStyle='#ff4444';
  mx.beginPath();mx.arc(80,80,3.5,0,Math.PI*2);mx.fill();
  const hx=Math.sin(P.head)*7, hz=Math.cos(P.head)*7;
  mx.strokeStyle='#ff4444';mx.lineWidth=2;
  mx.beginPath();mx.moveTo(80,80);mx.lineTo(80+hx,80+hz);mx.stroke();

  renderer.render(scene,cam);
}

init();
</script>
